name: Peskas Timor Data Pipeline

on:
  push:
  schedule:
    - cron:  '0 0 */2 * *'

env:
  KOBO_PASSWORD: ${{ secrets.KOBO_PASSWORD }}
  KOBO_USERNAME: ${{ secrets.KOBO_USERNAME }}
  KOBO_PESKAS1: ${{ secrets.KOBO_PESKAS1 }}
  KOBO_PESKAS2: ${{ secrets.KOBO_PESKAS2 }}
  KOBO_PESKAS3: ${{ secrets.KOBO_PESKAS3 }}
  # Read by the harmonized `ingestion.landings.<v>` block. Same values as the
  # legacy names above; the secrets themselves are renamed in migration Phase 9.
  KOBO_ASSET_ID_V1: ${{ secrets.KOBO_PESKAS1 }}
  KOBO_ASSET_ID_V2: ${{ secrets.KOBO_PESKAS2 }}
  KOBO_ASSET_ID_V3: ${{ secrets.KOBO_PESKAS3 }}
  GCP_SA_KEY: ${{ secrets.PESKAS_DATAINGESTION_GCS_KEY }}
  AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
  AIRTABLE_BASE_ID_FRAME: ${{ secrets.AIRTABLE_BASE_ID_FRAME }}
  PDS_TOKEN: ${{ secrets.PESKAS_PDS_TOKEN }}
  PDS_SECRET: ${{ secrets.PESKAS_PDS_SECRET }}
  VALID_SHEET_ID: ${{ secrets.VALID_SHEET_ID }}
  GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
  # The validation flags sink, since migration Phase 5. NOTE: this secret does
  # not exist yet — until it is created, `validate_landings()` logs a warning
  # and the versioned flags snapshot in cloud storage is the only record of a
  # run. The secret is a *user* action, deliberately not worked around here.
  MONGODB_CONNECTION_STRING_VALIDATION: ${{ secrets.MONGODB_CONNECTION_STRING_VALIDATION }}
  # Optional. Present: manual approvals entered in KoBoToolbox survive a run.
  # Absent: they are overwritten by the pipeline's own flags. Also has no
  # secret yet.
  KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}

jobs:
  build-container:
    name: Build R container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve latest peskas.coasts release
        id: coasts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref=$(gh api repos/WorldFishCenter/peskas.coasts/releases/latest --jq .tag_name)
          if [ -z "$ref" ] || [ "$ref" = "null" ]; then
            echo "Failed to resolve latest peskas.coasts release" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Resolved peskas.coasts ref: $ref"
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          build-args: |
            COASTS_REF=${{ steps.coasts.outputs.ref }}
          tags: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
          cache-from: type=registry,ref=ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:buildcache
          cache-to: type=registry,ref=ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:buildcache,mode=max

  ingest-preprocess-metadata-tables:
    name: Ingest metadata tables
    needs: build-container
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call ingest_metadata_tables()
        run: Rscript -e 'peskas.timor.data.pipeline::ingest_metadata_tables()'
      - name: Call preprocess_metadata_tables()
        run: Rscript -e 'peskas.timor.data.pipeline::preprocess_metadata_tables()'
      - name: Call ingest_assets()
        run: Rscript -e 'peskas.timor.data.pipeline::ingest_assets()'

  ingest-landings:
    name: Ingest landings
    needs: build-container
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call ingest_landings()
        run: Rscript -e 'peskas.timor.data.pipeline::ingest_landings()'

  preprocess-landings:
    name: Preprocess landings
    needs: [ingest-landings, ingest-preprocess-metadata-tables]
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call preprocess_landings()
        run: Rscript -e 'peskas.timor.data.pipeline::preprocess_landings()'

  merge-landings:
    name: Merge landings
    needs: [preprocess-landings]
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call merge_landings()
        run: Rscript -e 'peskas.timor.data.pipeline::merge_landings()'
      - name: Call calculate_weights()
        run: Rscript -e 'peskas.timor.data.pipeline::calculate_weights()'

  validate-landings:
    name: Validate landings
    needs: [merge-landings]
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Validate landings
        run: Rscript -e 'peskas.timor.data.pipeline::validate_landings()'
      - name: Test validated landings
        run: Rscript -e 'tinytest::run_test_file(system.file("tinytest/test_validated_landings.R", package = "peskas.timor.data.pipeline"))'

  ingest-pds-data:
    name: Ingest pds data
    needs: build-container
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      # `log_threshold = logger::INFO` is **not optional**, and not a matter of
      # taste. `coasts::read_config()` ends with
      # `logger::log_debug("Running with parameters {conf}")`, and every coasts
      # workflow function defaults to `logger::DEBUG` — so calling one with the
      # default prints the full service-account private key, the MongoDB
      # connection string, the KoBo password and the PDS and Dataverse tokens
      # into this job's log. That is the leak Phase 3 removed from Timor's own
      # `read_config()`, arriving through the delegation. COASTS-TODO C21.
      - name: Call ingest_pds_trips()
        run: Rscript -e 'coasts::ingest_pds_trips(log_threshold = logger::INFO, package = "peskas.timor.data.pipeline")'
      - name: Call ingest_pds_tracks()
        run: Rscript -e 'coasts::ingest_pds_tracks(log_threshold = logger::INFO, package = "peskas.timor.data.pipeline")'

  preprocess-pds-data:
    name: Preprocess pds data
    needs: [ingest-pds-data]
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      # `coasts::preprocess_pds_tracks()` — the spatial grid summaries the other
      # three countries also run here — is deliberately not wired in, and
      # migration Phase 8 decided to leave it that way rather than run its first
      # pass out of band as Phase 7 did for the track conversion.
      #
      # Two reasons, in order. **Its output has no reader in Timor.** It exists
      # to feed `coasts::summarize_data()`, and that is what Kenya, Mozambique
      # and Zanzibar use it for; Timor's portal is the `public-timor` JSON
      # contract, which PLAN §2.1 keeps as-is, and `summarize_data()` is blocked
      # for Timor anyway on COASTS-TODO C17 (it resolves `asfis` and the grid
      # summaries from the country bucket, where Timor has neither). Producing
      # ~1.4 M grid rows and ~0.8 GB per run for nothing to read is not a
      # migration step. Second, it cannot complete in CI: it reads *every* track
      # in the bucket on its first pass with `parallel::detectCores() - 1`
      # workers, which is **one** on a 2-core runner — measured 2026-08-11,
      # Timor's 102k tracks are ~4 h at 13 workers locally. COASTS-TODO C20.
      #
      # Wire it in when C17 ships and Timor actually adopts a coasts consumer of
      # the grid summaries, not before.
      - name: Call describe_pds_tracks()
        run: Rscript -e 'peskas.timor.data.pipeline::describe_pds_tracks()'

  validate-pds-data:
    name: Validate pds data
    needs: preprocess-pds-data
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call validate_pds_trips()
        run: Rscript -e 'peskas.timor.data.pipeline::validate_pds_trips()'
      - name: Test validated PDS trips
        run: Rscript -e 'tinytest::run_test_file(system.file("tinytest/test_validated_pds_trips.R", package = "peskas.timor.data.pipeline"))'

  merge-trips:
    name: Merge trips
    needs: [validate-landings, validate-pds-data]
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call merge_trips()
        run: Rscript -e 'peskas.timor.data.pipeline::merge_trips()'
      - name: Test merged_trips
        run: Rscript -e 'tinytest::run_test_file(system.file("tinytest/test_merged_trips.R", package = "peskas.timor.data.pipeline"))'

  model-indicators:
    name: Estimate fishery indicators
    needs: [merge-trips]
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call estimate_fishery_indicators()
        run: Rscript -e 'peskas.timor.data.pipeline::estimate_fishery_indicators()'

  export-trips:
    name: Export trips
    needs: [merge-trips, model-indicators]
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call format_public_data()
        run: Rscript -e 'peskas.timor.data.pipeline::format_public_data()'
      - name: Call export_files()
        run: Rscript -e 'peskas.timor.data.pipeline::export_files()'        
      - name: Test public data
        run: Rscript -e 'tinytest::run_test_file(system.file("tinytest/test_public_data.R", package = "peskas.timor.data.pipeline"))'
      - name: Generate and upload enumerators report
        run: Rscript -e 'source(system.file("report/generate_enumerators_report.R", package = "peskas.timor.data.pipeline"))'
