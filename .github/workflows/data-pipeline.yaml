name: Peskas Timor Data Pipeline

on:
  push:
  schedule:
    - cron:  '0 0 */2 * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  KOBO_PASSWORD: ${{ secrets.KOBO_PASSWORD }}
  KOBO_USERNAME: ${{ secrets.KOBO_USERNAME }}
  # The secrets keep their older names: secret values are write-only, so
  # renaming them means re-entering the three asset ids by hand.
  KOBO_ASSET_ID_V1: ${{ secrets.KOBO_PESKAS1 }}
  KOBO_ASSET_ID_V2: ${{ secrets.KOBO_PESKAS2 }}
  KOBO_ASSET_ID_V3: ${{ secrets.KOBO_PESKAS3 }}
  GCP_SA_KEY: ${{ secrets.PESKAS_DATAINGESTION_GCS_KEY }}
  AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
  AIRTABLE_BASE_ID_FRAME: ${{ secrets.AIRTABLE_BASE_ID_FRAME }}
  PDS_TOKEN: ${{ secrets.PESKAS_PDS_TOKEN }}
  PDS_SECRET: ${{ secrets.PESKAS_PDS_SECRET }}
  # The validation flags sink. Absent → `validate_landings()` warns and the
  # versioned flags snapshot in cloud storage is the only record of a run.
  MONGODB_CONNECTION_STRING_VALIDATION: ${{ secrets.MONGODB_CONNECTION_STRING_VALIDATION }}
  # Optional, and has no secret. Present: manual approvals entered in
  # KoBoToolbox survive a run. Absent: they are overwritten by the pipeline's
  # own flags. `sync_validation_status()` is not wired in either way.
  KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}

jobs:
  build-container:
    name: Build R container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve latest peskas.coasts release
        id: coasts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref=$(gh api repos/WorldFishCenter/peskas.coasts/releases/latest --jq .tag_name)
          if [ -z "$ref" ] || [ "$ref" = "null" ]; then
            echo "Failed to resolve latest peskas.coasts release" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Resolved peskas.coasts ref: $ref"
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          build-args: |
            COASTS_REF=${{ steps.coasts.outputs.ref }}
          tags: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
          cache-from: type=registry,ref=ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:buildcache
          cache-to: type=registry,ref=ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:buildcache,mode=max

  ingest-landings:
    name: Ingest landings
    needs: build-container
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call ingest_landings()
        run: Rscript -e 'peskas.timor.data.pipeline::ingest_landings()'

  preprocess-landings:
    name: Preprocess landings
    needs: [ingest-landings]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call preprocess_landings()
        run: Rscript -e 'peskas.timor.data.pipeline::preprocess_landings()'

  merge-landings:
    name: Merge landings
    needs: [preprocess-landings]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call merge_landings()
        run: Rscript -e 'peskas.timor.data.pipeline::merge_landings()'
      - name: Call calculate_weights()
        run: Rscript -e 'peskas.timor.data.pipeline::calculate_weights()'

  validate-landings:
    name: Validate landings
    needs: [merge-landings]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Validate landings
        run: Rscript -e 'peskas.timor.data.pipeline::validate_landings()'
      - name: Test validated landings
        run: >
          Rscript -e 'r <- tinytest::run_test_file(system.file("tinytest/test_validated_landings.R",
          package = "peskas.timor.data.pipeline"));
          if (any(!vapply(r, isTRUE, logical(1)))) quit(status = 1)'

  # The cross-country API export, deliberately a leaf so the portal path never
  # depends on it. It reads the weight artefact and the validated long parquet,
  # so it waits for both jobs while everything after `merge-trips` runs in
  # parallel.
  # above, so the bucket follows `storage.google.options_api` — `peskas-api-dev`
  # on a branch, `peskas-api-prod` on `main`.
  #
  # Through Phases 9-11a these two steps were additionally gated
  # `if: ${{ !endsWith(github.ref, '/main') }}`, which published to `-dev` only
  # and, on `main`, skipped the export altogether rather than promoting it. That
  # was deliberate while Timor's first write to `peskas-api-prod` was an unmade
  # decision; it was made on 2026-09-04, so Timor now publishes on the same terms
  # as the other three countries.
  export-api:
    name: Export cross-country API
    needs: [merge-landings, validate-landings]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call export_api_raw()
        run: Rscript -e 'peskas.timor.data.pipeline::export_api_raw()'
      - name: Call export_api_validated()
        run: Rscript -e 'peskas.timor.data.pipeline::export_api_validated()'

  ingest-pds-data:
    name: Ingest pds data
    needs: build-container
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      # `log_threshold = logger::INFO` stays, deliberately. It used to be
      # load-bearing: `coasts::read_config()` ended with
      # `log_threshold = logger::INFO` is a guard, not a fix: a coasts workflow
      # function called at its default DEBUG level once printed the whole
      # resolved config — service-account key included — into the job log.
      - name: Call ingest_pds_trips()
        run: Rscript -e 'coasts::ingest_pds_trips(log_threshold = logger::INFO, package = "peskas.timor.data.pipeline")'
      - name: Call ingest_pds_tracks()
        run: Rscript -e 'coasts::ingest_pds_tracks(log_threshold = logger::INFO, package = "peskas.timor.data.pipeline")'

  preprocess-pds-data:
    name: Preprocess pds data
    needs: [ingest-pds-data]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      # `coasts::preprocess_pds_tracks()` — the spatial grid summaries the other
      # three countries run here — is deliberately not wired in: its output
      # feeds `coasts::summarize_data()`, which Timor does not use, and its
      # first pass reads every track in the bucket.
      - name: Call describe_pds_tracks()
        run: Rscript -e 'peskas.timor.data.pipeline::describe_pds_tracks()'

  validate-pds-data:
    name: Validate pds data
    needs: preprocess-pds-data
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call validate_pds_trips()
        run: Rscript -e 'peskas.timor.data.pipeline::validate_pds_trips()'
      - name: Test validated PDS trips
        run: >
          Rscript -e 'r <- tinytest::run_test_file(system.file("tinytest/test_validated_pds_trips.R",
          package = "peskas.timor.data.pipeline"));
          if (any(!vapply(r, isTRUE, logical(1)))) quit(status = 1)'

  merge-trips:
    name: Merge trips
    needs: [validate-landings, validate-pds-data]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call merge_trips()
        run: Rscript -e 'peskas.timor.data.pipeline::merge_trips()'
      - name: Test merged_trips
        run: >
          Rscript -e 'r <- tinytest::run_test_file(system.file("tinytest/test_merged_trips.R",
          package = "peskas.timor.data.pipeline"));
          if (any(!vapply(r, isTRUE, logical(1)))) quit(status = 1)'

  model-indicators:
    name: Estimate fishery indicators
    needs: [merge-trips]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call estimate_fishery_indicators()
        run: Rscript -e 'peskas.timor.data.pipeline::estimate_fishery_indicators()'

  export-trips:
    name: Export trips
    needs: [merge-trips, model-indicators]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call format_public_data()
        run: Rscript -e 'peskas.timor.data.pipeline::format_public_data()'
      - name: Call export_files()
        run: Rscript -e 'peskas.timor.data.pipeline::export_files()'        
      - name: Test public data
        run: >
          Rscript -e 'r <- tinytest::run_test_file(system.file("tinytest/test_public_data.R",
          package = "peskas.timor.data.pipeline"));
          if (any(!vapply(r, isTRUE, logical(1)))) quit(status = 1)'

