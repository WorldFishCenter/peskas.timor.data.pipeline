# Runs the data report against the container `data-pipeline.yaml` builds and
# pushes on every run. It deliberately does **not** build its own image: the
# duplicate `build-container` job it used to carry could not succeed, because
# `Dockerfile.prod` takes `ARG COASTS_REF` with no default and this workflow
# never resolved or passed one.
#
# Its schedule fires from the **default branch**, so it always runs `main`'s
# code regardless of which branch last changed this file.
name: Generate and upload data report

on:
  schedule:
    - cron: '0 0 * * 1,4'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GCP_SA_KEY: ${{ secrets.PESKAS_DATAINGESTION_GCS_KEY }}
  # The report reads taxa and boats through `get_assets()`, which finds Timor's
  # forms in the Airtable frame by their KoBo asset ids.
  KOBO_ASSET_ID_V2: ${{ secrets.KOBO_PESKAS2 }}
  KOBO_ASSET_ID_V3: ${{ secrets.KOBO_PESKAS3 }}
  AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
  AIRTABLE_BASE_ID_FRAME: ${{ secrets.AIRTABLE_BASE_ID_FRAME }}

jobs:
  data-report:
    name: Generate data report
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Generate and upload data report
        run: Rscript -e 'source(system.file("report/generate_upload_report.R", package = "peskas.timor.data.pipeline"))'
