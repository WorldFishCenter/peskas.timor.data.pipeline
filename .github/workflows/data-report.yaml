# Runs the data report against the container `data-pipeline.yaml` builds and
# pushes on every run. It deliberately does **not** build its own image: the
# duplicate `build-container` job it used to carry could not succeed any more,
# because `Dockerfile.prod` has taken `ARG COASTS_REF` with no default since
# migration Phase 2 and this workflow never resolved or passed one.
#
# State: `disabled_inactivity`. Re-enabling is a Phase 11 action, not a Phase 9
# one — a schedule fires from the **default branch**, so until the migration
# branch is merged this file's schedule would run `main`'s pre-migration code.
name: Generate and upload data report

on:
  schedule:
    - cron: '0 0 * * 1,4'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GCP_SA_KEY: ${{ secrets.PESKAS_DATAINGESTION_GCS_KEY }}

jobs:
  data-report:
    name: Generate data report
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Generate and upload data report
        run: Rscript -e 'source(system.file("report/generate_upload_report.R", package = "peskas.timor.data.pipeline"))'
