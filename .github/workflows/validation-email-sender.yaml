# The weekly validation summary mail. `send_validation_mail()` reads the
# MongoDB flags sink and the `validation.alerts` block of `inst/config.yml`, so
# it needs `MONGODB_CONNECTION_STRING_VALIDATION`.
#
# It runs in the container `data-pipeline.yaml` builds; it does not build one.
# Its schedule fires from the default branch.
name: Send validation summary email

on:
  schedule:
    - cron: '0 0 * * MON'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # No `GCP_SA_KEY`: this reads the flags from MongoDB and the
  # alert descriptions from `inst/config.yml`, and touches cloud storage nowhere.
  PESKAS_GMAIL_KEY: ${{ secrets.PESKAS_GMAIL_KEY }}
  MONGODB_CONNECTION_STRING_VALIDATION: ${{ secrets.MONGODB_CONNECTION_STRING_VALIDATION }}
  KOBO_ASSET_ID_V2: ${{ secrets.KOBO_PESKAS2 }}
  KOBO_ASSET_ID_V3: ${{ secrets.KOBO_PESKAS3 }}

jobs:
  send-mail:
    name: Send summary mail
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call send_validation_mail()
        run: Rscript -e 'peskas.timor.data.pipeline::send_validation_mail()'
