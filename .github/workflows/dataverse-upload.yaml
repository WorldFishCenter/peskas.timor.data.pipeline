# Publishes the public dataset family to Harvard Dataverse using the container
# `data-pipeline.yaml` builds. As with `data-report.yaml`, it does not build
# its own image, and its schedule fires from the default branch.
name: Upload public files to Dataverse

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GCP_SA_KEY: ${{ secrets.PESKAS_DATAINGESTION_GCS_KEY }}
  DATAVERSE_TOKEN: ${{ secrets.PESKAS_DATAVERSE_TOKEN }}

jobs:
  release-data:
    name: Release to Dataverse
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.timor.data.pipeline/r-runner-peskas-timor:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call upload_dataverse()
        run: Rscript -e 'peskas.timor.data.pipeline::upload_dataverse()'
