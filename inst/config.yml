# =============================================================================
# PESKAS TIMOR-LESTE — PIPELINE CONFIGURATION
# =============================================================================
#
# Two environments:
#   default     -> the *-dev buckets. Used locally and by every CI run not on
#                  `main`.
#   production  -> the live buckets. Set by CI on `main` only.
#
# Secrets come from the environment: from `.env` locally (copy `.env.example`),
# from the workflow environment in CI.
# =============================================================================


default:

  # Country slug. Used by coasts helpers and by the cross-country API
  # path (`timor/raw`, `timor/validated`).
  country: timor

  # ===========================================================================
  # INGESTION — data-source credentials
  # ===========================================================================
  # The three KoBo forms are versions of one source, `landings`:
  #   v1  SSF Landings  aur3fK7mtJem5Cg8Wi2SPd  frozen, last submission 2020-08-28
  #   v2  peskAAS       aaztUDtRzb9SpSV7i9iptb  live (low volume, offline backfills)
  #   v3  PeskAAS 2     aEoWV7aprG47Q4uTpaopgD  live (the current form)
  # All three are deployed and active on eu.kobotoolbox.org.
  # ===========================================================================
  ingestion:
    landings:
      v3:
        asset_id: !expr Sys.getenv('KOBO_ASSET_ID_V3')
        username: !expr Sys.getenv('KOBO_USERNAME')
        password: !expr Sys.getenv('KOBO_PASSWORD')
        token: !expr Sys.getenv('KOBO_TOKEN')
      v2:
        asset_id: !expr Sys.getenv('KOBO_ASSET_ID_V2')
        username: !expr Sys.getenv('KOBO_USERNAME')
        password: !expr Sys.getenv('KOBO_PASSWORD')
        token: !expr Sys.getenv('KOBO_TOKEN')
      v1:
        asset_id: !expr Sys.getenv('KOBO_ASSET_ID_V1')
        username: !expr Sys.getenv('KOBO_USERNAME')
        password: !expr Sys.getenv('KOBO_PASSWORD')
        token: !expr Sys.getenv('KOBO_TOKEN')

  # ===========================================================================
  # SURVEYS — pipeline stages
  # ===========================================================================
  surveys:

    # The parquets `coasts::summarize_data()` writes to the country bucket, each
    # named `<file_prefix>_<table>`. Only `_all_monthly_summaries` is read back,
    # by `coasts::export_coasts_metrics()`; the others exist to fill a country
    # dashboard, which Timor does not have. For the same reason
    # `exclude_dashboard_ids` is unset: with no dashboard there is nothing to
    # keep a survey form out of, and the coasts portal wants every form anyway.
    summaries:
      file_prefix: timor-summaries
      version: latest

    # `coasts::generate_fleet_analysis()` writes this; `coasts::export_portal()`
    # reads it for the dashboard's estimated trips, catch tonnage and revenue.
    # Distinct from `estimate_fishery_indicators()`, which models the same
    # quantities for the Timor portal's own `portal-*.json` and is unaffected.
    aggregated:
      file_prefix: timor-aggregated
      version: latest

    # Shape: {source}: {version}: raw / preprocessed / validated. File prefixes
    # match the object families already in `gs://timor`.
    landings:
      v3:
        raw:
          file_prefix: timor-landings-v3_raw
          version: latest
        preprocessed:
          file_prefix: timor-landings-v3_preprocessed
          version: latest
        validated:
          file_prefix: timor-landings-v3_validated
          version: latest
      v2:
        raw:
          file_prefix: timor-landings-v2_raw
          version: latest
        preprocessed:
          file_prefix: timor-landings-v2_preprocessed
          version: latest
        validated:
          file_prefix: timor-landings-v2_validated
          version: latest
      # v1 is frozen: `merge_landings()` reads the one-off `frozen` snapshot,
      # written once out of band. Nothing writes
      # `raw`/`preprocessed`; they name the snapshot's provenance.
      v1:
        raw:
          file_prefix: timor-landings-v1_raw
          version: latest
        preprocessed:
          file_prefix: timor-landings-v1_preprocessed
          version: latest
        frozen:
          file_prefix: timor-landings-v1-frozen
          version: latest
      # Cross-version products.
      merged:
        file_prefix: timor-landings-merged
        version: latest
      weight:
        file_prefix: timor-landings-merged_weight
        version: latest
      # The one validated artefact: flat, long, parquet. Read by the API export
      # and, through `get_validated_landings()`, by the whole portal path.
      validated_long:
        file_prefix: timor-landings-merged_validated_long
        version: latest
      # A versioned snapshot of the validation flags, beside the MongoDB sink.
      validation:
        flags:
          file_prefix: validation_alerts
          version: latest

  # ===========================================================================
  # PDS — Pelagic Data Systems (vessel tracking)
  # ===========================================================================
  pds:

    token: !expr Sys.getenv('PDS_TOKEN')
    secret: !expr Sys.getenv('PDS_SECRET')

    # Which of the token's trips are fishing trips. The PDS token returns only
    # Timor's trips, so the whole job here is to drop the projects that are not
    # fishing: both `Traders` entries track bicycle journeys.
    #
    # A denylist rather than a list of devices we own, because `pds_devices`
    # records who owns a device *now* while the trips are historical — an
    # allowlist silently discards the history of any tracker later sold on.
    exclude_customers:
      - "Traders"
      - "FSSP2: Traders"

    # The fishing fleet's current devices, for `coasts::generate_fleet_analysis()`.
    # An allowlist is right here and wrong above: this filters the *device*
    # roster by who owns a tracker now, which is what fleet size means, while
    # `exclude_customers` filters *historical trips* and must not drop the
    # history of a tracker since reassigned. Same list as
    # `metadata$tracker_imeis$customers`, for the same reason.
    customers:
      - "MAF / WorldFish"
    # Stage artefacts, read by `coasts::ingest_pds_trips()` and
    # `coasts::ingest_pds_tracks()`. Tracks are one `pds-tracks_<id>.parquet`
    # per trip and are not versioned, so a re-ingest overwrites.
    pds_trips:
      file_prefix: pds-trips
      version: latest
    pds_tracks:
      file_prefix: pds-tracks
      version: latest
      # The per-trip track descriptors `validate_pds_trips()` joins on.
      descriptors:
        file_prefix: pds-tracks-descriptors
        version: latest

  # ===========================================================================
  # API — cross-country trip interchange
  # ===========================================================================
  # Written to the `options_api` bucket below. Kenya, Mozambique and Zanzibar
  # publish the same 22-column schema, so it is a cross-country contract.
  # ===========================================================================
  api:
    trips:
      raw:
        file_prefix: trips-raw
        cloud_path: timor/raw
      validated:
        file_prefix: trips-validated
        cloud_path: timor/validated

  # ===========================================================================
  # METADATA — reference data and lookup tables
  # ===========================================================================
  metadata:
    # GAUL boundary geojson, held in the shared coasts bucket rather than this
    # country's. `coasts::export_coasts_metrics()` joins `gaul2` to the monthly
    # summaries to attach a municipality to each administrative post, and
    # `coasts::export_geos()` renders both levels on the portal. Checked
    # 2026-09-10: all 20 administrative posts the API publishes match a
    # `gaul2_name` in the gaul2 file exactly, and every municipality those
    # resolve to is present in the gaul1 file.
    #
    # First key under `metadata`, as in Kenya, Mozambique and Zanzibar.
    map_boundaries:
      gaul1: TLS_boundaries_gaul1
      gaul2: TLS_boundaries_gaul2

    asfis:
      file_prefix: asfis

    # Every tracker IMEI Timor has deployed. Enumerators write down 7 of a
    # tracker's 15 digits, so `validate_imeis()` reconstructs the full number by
    # matching that fragment against this roster.
    #
    # It spans retired and redeployed devices, because a submission from any
    # year can reference one. `tracker_imeis()` maintains it, unioning the
    # stored archive with the frame's current devices.
    tracker_imeis:
      file_prefix: tracker-imeis
      # The frame's device table is cross-country, so the current half of the
      # roster is narrowed to Timor's fishing customer. `Traders` and
      # `FSSP2: Traders` are bicycle projects and are deliberately absent.
      customers:
        - "MAF / WorldFish"

    # Which coast each landing site is on. Coast is a property of the site, not
    # the municipality, and latitude cannot derive it: two municipalities have
    # sites on both coasts, and Oecusse is an exclave whose north-facing sites
    # sit further south than most of the south coast.
    #
    # Keys are the landing site names as the Airtable frame spells them. All 40
    # are listed; a landing whose site is absent warns rather than silently
    # being counted as South Coast.
    coast_areas:
      "North Coast":
        - "Batugade"
        - "Bausiu/Bokos/Posto Sika/Oebau/Mahata/Tulaika/Sakato- RAEOA"
        - "Beacou/Sulilaran"
        - "Beto Tasi/Bebonuk/Fatuhada/Kampur Alor"
        - "Bidau Santana/Metiaut"
        - "Com"
        - "Comando/Obrato/Behau"
        - "Dolok Oan/Hera/Metinaro/Manleu"
        - "Ililai"
        - "Leopa/Do Tasi"
        - "Oenunu/Citrana/Bona/Baoknana"
        - "Sanirin/Palaka"
        - "Seical/Buruma/Fatuk Bo'ot/Uaica'a"
        - "Sentru/Liarafa/Sika/Rau Moko"
        - "Tasi Mean"
        - "Tutuala/Valu/Savirara"
        - "Tutubaba"
        - "Vatuvou"
        - "Vemasse/Cairavela/Kp. Baru/Edang/Sukaer Laran"
        - "Watabou/Binagua/Buigira"
      "South Coast":
        - "Adarai"
        - "Aliambata"
        - "Beasu"
        - "Betano"
        - "Bonuk/Fatumeta/Nunumera"
        - "Dais"
        - "Lore"
        - "Natarbora"
        - "Selihasan"
        - "We Hasan/We Inan"
        - "Welaleti"
        - "Welaluhu"
      "Atauro island":
        - "Adara/Atecro"
        - "Beloi/Usu Bemacu"
        - "Berao/Maquili"
        - "Biqueli/Pala"
        - "Fatu'u/Doru/Iliana/Arlo"
        - "Maquer"
        - "Raiketa/Vila"
        - "Uaroana/Acrema"

    # FAO major fishing areas the length-weight coefficients are
    # restricted to. Timor-Leste straddles **57** (Indian Ocean, Eastern) and
    # **71** (Pacific, Western Central).
    #
    # This key MUST be set: `coasts::resolve_fao_areas()` falls back to
    # `c(51, 57)`, which would filter Timor on one wrong area and miss the
    # Pacific one entirely, with no error.
    fishbase:
      fao_areas: [57, 71]

      # The FishBase / SeaLifeBase release, pinned. `"latest"` is not a fixed
      # dataset and follows whichever host the installed `rfishbase` points at,
      # so a container rebuild can silently change every published weight.
      db_version: "25.04"

    nutrients:
      RDI:
        name:
          calcium: 1
          iron: 0.0294
          selenium: 0.000026
          zinc: 0.0049
          protein: 46
          vitaminA: 0.0005
          omega3: 2.939
    # Cloud-storage prefix of the Airtable assets snapshot. coasts reads
    # `name` in most places and `assets` in one, so both are provided.
    airtable:
      name: assets
      assets: assets
      # The snapshot is shared across countries and has no `country` column, so
      # Timor's rows are selected by the Airtable record ids of its two survey
      # forms. Those ids are resolved at run time from the KoBo asset ids in
      # `ingestion.landings`, so they are not configured here.

  # ===========================================================================
  # AIRTABLE — the cross-country frame
  # ===========================================================================
  # The PESKAS | FRAME base maps each country's raw form labels to
  # `standard_name` / `alpha3_code` / FAO codes, and is authoritative wherever
  # it overlaps Timor's own reference data. `coasts::ingest_assets()` snapshots
  # it to cloud storage; everything here reads that snapshot.
  #
  # `AIRTABLE_TOKEN` is the BARE `pat…` — coasts prepends "Bearer ".
  # ===========================================================================
  airtable:
    token: !expr Sys.getenv('AIRTABLE_TOKEN')
    frame:
      base_id: !expr Sys.getenv('AIRTABLE_BASE_ID_FRAME')

  peskas_mail:
    key: !expr Sys.getenv("PESKAS_GMAIL_KEY")

  # ===========================================================================
  # VALIDATION — thresholds and flag sink
  # ===========================================================================
  validation:
    landings:
      default:
        method: MAD
        k: 3
        max: 20
        min: 0
      survey_time:
        max_duration: 96
        submission_delay: 28
      catch:
        n_individuals:
          k: 2.5
      cook_dist: 5
      price_per_weight:
        min_limit: 0.25
        max_limit: 30
      mesh: 200
      gleaners:
        k: 1.5
      fuel:
        k: 3
    # The alert dictionary, read by `send_validation_mail()`. The codes are the
    # contract — see the table at the top of `R/validation-functions.R`.
    #
    # Codes 7, 8, 9 and 13/15/18 have no live producer: 7 and 9 were retired
    # thresholds, 8 is covered by taking the absolute value, and 13/15/18 are
    # reachable but have never fired on Timor's data.
    alerts:
      "0": No alert
      "1": Not enough digits recorded to match IMEI
      "2": More than one valid IMEI can be matched to the record
      "3": None of the deployed devices has an IMEI matching the record
      "4": Submission date is prior to landing date
      "5": Trip duration is too long
      "6": Total catch value is too large
      "7": Recorded length is too large for the catch type
      "8": Total catch value is negative
      "9": Total catch value is too small
      "10": Survey submitted more than 28 days after landing date
      "11": Number of individuals is too large
      "12": Boat type specified doesn't match previous records
      "13": No boat type recorded for a trip that declared a boat
      "14": Gear type specified doesn't match previous records
      "15": No gear type recorded for a trip that declared a boat
      "16": Site not valid
      "17": Abnormal price-weight relation
      "18": Anomalous number of fishers
      "19": Habitat not valid
      "20": Anomalous mesh size
      "21": Anomalous gleaners number
      "22": No catch associated to non-null revenue / invdividuals or viceversa
      "23": Anomalous fuel value or associated to unmotorized boat
    pds_trips:
      max_trip_hours: 96
      min_trip_hours: 0.5
      trip_km: 200
      start_end_km: 3
      outliers : 10
      timetrace: 1400
      consecutive_time: 3
      consecutive_distance: 2

  merged_trips:
    file_prefix: all_trips

  models:
    file_prefix: model_predictions
    all_taxa: [APO, BAR, BEN, BGX, BWH, CBA, CGX, CJX, CLP, COZ, CRA, CUX, DOS, DOX, DRZ, DSF, ECN, EMP, FLY, GOX, GPX, GRX, GZP, IAX,IHX, KYX, LGE, LWX, MHL, MIL, MOB, MOJ, MOO, MUI, MUL, OCZ, PEZ, PUX, PWT, RAX, SDX, SFA, SKH, SLV, SNA, SPI, SRX, SUR, SWX, THF, THO, TRI, TUN, WRA, YDX, MZZ]
    modelled_taxa: [CLP, GZP, TUN, SDX, FLY, CGX, MOO, SNA, CJX, BEN, RAX, LWX, MZZ]

  export:
    file_prefix: timor

  export_dataverse:
    server: 'dataverse.harvard.edu'
    dataverse_id: 'peskas'
    token: !expr Sys.getenv('DATAVERSE_TOKEN')
    # Dataset metadata is posted from `inst/export/dataset-fields.json`.

  report:
    file_prefix: data_report
    summary_data: summary_data

  # ===========================================================================
  # STORAGE
  # ===========================================================================
  storage:
    google:
      key: gcs
      options:
        project: peskas
        bucket: timor-dev
        service_account_key: !expr Sys.getenv('GCP_SA_KEY')
      # shared cross-country hub bucket (coasts helpers).
      options_coasts:
        project: peskas
        bucket: peskas-coasts-dev
        service_account_key: !expr Sys.getenv('GCP_SA_KEY')
      # cross-country API bucket. See the `api` block above.
      options_api:
        project: peskas
        bucket: peskas-api-dev
        service_account_key: !expr Sys.getenv('GCP_SA_KEY')

    # -------------------------------------------------------------------------
    # MongoDB — the validation flags sink.
    # -------------------------------------------------------------------------
    # Address a storage provider explicitly as `conf$storage$google`; nothing
    # may iterate the children of `storage`, since `mongodb` is one of them.
    #
    # `dashboard` is the country-dashboard sink `coasts::export_portal()` fills,
    # the same five collections Kenya, Mozambique and Zanzibar write. It is not
    # what serves the Timor portal: that is still versioned `portal-*.json` in
    # the public bucket, written by `export_files()` and untouched by this.
    # Nor is it what serves the multi-country coasts portal, which reads
    # `timor_monthly_summaries_map` as a parquet from the coasts bucket.
    mongodb:
      connection_strings:
        main: !expr Sys.getenv('MONGODB_CONNECTION_STRING')
        validation: !expr Sys.getenv('MONGODB_CONNECTION_STRING_VALIDATION')
      databases:
        pipeline:
          database_name: timor-dev
          collections:
            export: export
        validation:
          database_name: validation-dev
          collections:
            flags: surveys_flags
            enumerators_stats: enumerators_stats
        dashboard:
          database_name: portal-dev
          collections:
            monthly_summaries: monthly_summaries
            taxa_summaries: taxa_summaries
            districts_summaries: districts_summaries
            gear_summaries: gear_summaries
            grid_summaries: grid_summaries

  pds_storage:
    google:
      key: gcs
      options:
        project: peskas
        bucket: pds-timor-dev
        service_account_key: !expr Sys.getenv('GCP_SA_KEY')

  # Timor-only: the portal contract bucket. No other country has this.
  public_storage:
    google:
      key: gcs
      options:
        project: peskas
        bucket: public-timor-dev
        service_account_key: !expr Sys.getenv('GCP_SA_KEY')

# =============================================================================
# PRODUCTION — overrides only
# =============================================================================
production:
  storage:
    google:
      options:
        bucket: timor
      options_coasts:
        bucket: peskas-coasts
      options_api:
        bucket: peskas-api-prod
    mongodb:
      databases:
        pipeline:
          database_name: timor-prod
        validation:
          database_name: validation-prod
        dashboard:
          database_name: portal-prod
  pds_storage:
    google:
      options:
        bucket: pds-timor
  public_storage:
    google:
      options:
        bucket: public-timor
